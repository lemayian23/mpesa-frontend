<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Pesa Payment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>M-Pesa Payment</h1>
    <p class="subtitle">Enter your details to pay via M-Pesa</p>

    <form id="paymentForm">
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="2547XXXXXXXX" required>
      </div>

      <div class="form-group">
        <label for="amount">Amount (KES)</label>
        <input type="number" id="amount" placeholder="100" min="1" required>
      </div>

      <div class="form-group">
        <label for="reference">Account Reference</label>
        <input type="text" id="reference" placeholder="INV-001" value="INV-001">
      </div>

      <button type="submit" id="payBtn">Pay Now</button>
    </form>

    <div id="status" class="status"></div>

    <div id="transactionInfo" class="transaction-info"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
